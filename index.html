<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kositypinggame</title>
  <link rel="stylesheet" href="ktg.css">
</head>
<body>
  <div class="display">
    <div class="detect" style="font-size: 50px;"></div>
    <div class="display-words" style="font-size: 50px;"></div>
  </div>
  <div style="margin-top: 100px;"></div>
  <div class="track">
    <div class="target" style="font-size: 30px;"></div>
    <div class="scores" style="font-size: 30px;"></div>
  </div>
  <div class="track">
    <div class="accuracy" style="font-size: 30px;"></div>
    <div class="speed" style="font-size: 30px;"></div>
  </div>
  <div class="next"><button class="next-btn" style="font-size: 50px;">Next</button></div>
  
  <script src="ktg.js" type="module"></script>
</body>
</html>
